<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>橋牌計分器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 340px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #1a1a1a; margin-bottom: 1.5rem; }
        
        .row { display: flex; gap: 10px; margin-bottom: 1rem; }
        .col { flex: 1; text-align: left; }

        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; font-weight: 600; color: #555; }
        select, input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #f9f9f9;
            box-sizing: border-box; 
        }
        select:focus { border-color: #4a90e2; outline: none; }

        .vul-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f1f1;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .vul-wrapper label { margin: 0; cursor: pointer; }
        input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }

        /* 結果區塊 */
        .result-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: #f0f9ff;
            border-radius: 12px;
            border: 2px solid #bae6fd;
            transition: all 0.3s ease;
        }
        
        /* 新增：合約術語顯示 (例如 5C X -3) */
        .contract-text {
            font-size: 2rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 0.5rem;
            font-family: "Arial Black", "Helvetica Neue", sans-serif; /* 用粗體字更顯眼 */
            letter-spacing: 1px;
        }

        .result-score {
            font-size: 2.5rem; /* 分數稍微縮小一點點，讓視覺平衡 */
            font-weight: 800;
            color: #0284c7;
            line-height: 1.2;
        }
        .result-desc { font-size: 0.9rem; color: #64748b; margin-top: 0.5rem; }

        /* 負分樣式 */
        .result-box.penalty {
            background-color: #fef2f2;
            border-color: #fecaca;
        }
        .result-box.penalty .result-score { color: #dc2626; }
        .result-box.penalty .contract-text { color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h2>♠️ 合約橋牌計分</h2>

    <div class="row">
        <div class="col">
            <label>線位 (Level)</label>
            <select id="level">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6 (小滿貫)</option>
                <option value="7">7 (大滿貫)</option>
            </select>
        </div>
        <div class="col">
            <label>花色 (Suit)</label>
            <select id="suit">
                <option value="C">♣️ 梅花</option>
                <option value="D">♦️ 方塊</option>
                <option value="H">♥️ 愛心</option>
                <option value="S">♠️ 黑桃</option>
                <option value="NT">🚫 無王</option>
            </select>
        </div>
    </div>

    <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
        <label>賭倍狀態 (Doubling)</label>
        <select id="doubleState">
            <option value="1">無 (Undoubled)</option>
            <option value="2">❌ 賭倍 (Doubled)</option>
            <option value="4">❌❌ 再賭倍 (Redoubled)</option>
        </select>
    </div>

    <div class="vul-wrapper">
        <label for="isVul">🔴 有身價 (Vulnerable)</label>
        <input type="checkbox" id="isVul">
    </div>

    <div class="form-group" style="text-align: left;">
        <label>吃到墩數 (Tricks Won)</label>
        <select id="tricksWon">
            </select>
    </div>

    <div id="resultBox" class="result-box">
        <div id="contractOutput" class="contract-text">1C =</div>
        <div id="scoreOutput" class="result-score">70</div>
        <div id="scoreDesc" class="result-desc">部分合約</div>
    </div>
</div>

<script>
    // 初始化墩數選單 (0-13)
    const tricksSelect = document.getElementById('tricksWon');
    for (let i = 0; i <= 13; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.text = i;
        if (i === 7) option.selected = true;
        tricksSelect.appendChild(option);
    }

    // 監聽所有欄位
    const inputs = ['level', 'suit', 'doubleState', 'isVul', 'tricksWon'];
    inputs.forEach(id => {
        document.getElementById(id).addEventListener('change', calculateScore);
    });

    function calculateScore() {
        // 1. 讀取數值
        const level = parseInt(document.getElementById('level').value);
        const suit = document.getElementById('suit').value;
        const doubleFactor = parseInt(document.getElementById('doubleState').value);
        const isVul = document.getElementById('isVul').checked;
        const tricksWon = parseInt(document.getElementById('tricksWon').value);
        
        const contractTarget = level + 6;
        const diff = tricksWon - contractTarget;
        
        let totalScore = 0;
        let descText = "";
        const resultBox = document.getElementById('resultBox');

        // === 產生術語字串 (例如 5C X -3) ===
        let notation = `${level}${suit}`;
        
        // 處理賭倍符號
        if (doubleFactor === 2) notation += " X";
        else if (doubleFactor === 4) notation += " XX";

        // 處理結果 (=, +1, -2)
        if (diff === 0) notation += " =";
        else if (diff > 0) notation += " +" + diff;
        else notation += " " + diff; // diff 本身是負數，如 -3

        // 更新術語顯示
        document.getElementById('contractOutput').innerText = notation;

        // === 計算分數 ===
        if (diff >= 0) {
            // 成約 (Made)
            resultBox.classList.remove('penalty');

            let baseTrickScore = 0;
            if (suit === 'C' || suit === 'D') baseTrickScore = level * 20;
            else if (suit === 'H' || suit === 'S') baseTrickScore = level * 30;
            else if (suit === 'NT') baseTrickScore = 40 + (level - 1) * 30;

            let finalTrickScore = baseTrickScore * doubleFactor;

            let gameBonus = 0;
            if (finalTrickScore >= 100) {
                gameBonus = isVul ? 500 : 300;
                descText = "成局";
            } else {
                gameBonus = 50;
                descText = "部分合約";
            }

            let slamBonus = 0;
            if (level === 6) {
                slamBonus = isVul ? 750 : 500;
                descText = "小滿貫";
            } else if (level === 7) {
                slamBonus = isVul ? 1500 : 1000;
                descText = "大滿貫";
            }

            let insultBonus = 0;
            if (doubleFactor === 2) insultBonus = 50;
            if (doubleFactor === 4) insultBonus = 100;

            let overtrickScore = 0;
            if (diff > 0) {
                if (doubleFactor === 1) {
                    let perTrick = (suit === 'C' || suit === 'D') ? 20 : 30;
                    overtrickScore = diff * perTrick;
                } else if (doubleFactor === 2) {
                    overtrickScore = diff * (isVul ? 200 : 100);
                } else if (doubleFactor === 4) {
                    overtrickScore = diff * (isVul ? 400 : 200);
                }
            }

            totalScore = finalTrickScore + gameBonus + slamBonus + insultBonus + overtrickScore;

        } else {
            // 倒約 (Down)
            resultBox.classList.add('penalty');
            const down = Math.abs(diff);
            let penalty = 0;

            if (doubleFactor === 1) {
                penalty = down * (isVul ? 100 : 50);
            } else if (doubleFactor === 2) {
                if (!isVul) {
                    if (down === 1) penalty = 100;
                    else if (down === 2) penalty = 300;
                    else if (down === 3) penalty = 500;
                    else penalty = 500 + (down - 3) * 300;
                } else {
                    if (down === 1) penalty = 200;
                    else penalty = 200 + (down - 1) * 300;
                }
            } else if (doubleFactor === 4) {
                let basePenalty = 0;
                if (!isVul) {
                    if (down === 1) basePenalty = 100;
                    else if (down === 2) basePenalty = 300;
                    else if (down === 3) basePenalty = 500;
                    else basePenalty = 500 + (down - 3) * 300;
                } else {
                    if (down === 1) basePenalty = 200;
                    else basePenalty = 200 + (down - 1) * 300;
                }
                penalty = basePenalty * 2;
            }

            totalScore = -penalty;
            descText = `倒約 ${down} 墩`;
        }

        document.getElementById('scoreOutput').innerText = totalScore;
        document.getElementById('scoreDesc').innerText = descText;
    }

    calculateScore();
</script>

</body>
</html>
