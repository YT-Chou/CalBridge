<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業橋牌計分器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            width: 340px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #1a1a1a; margin-bottom: 1.5rem; }
        
        /* 兩欄佈局 */
        .row { display: flex; gap: 10px; margin-bottom: 1rem; }
        .col { flex: 1; text-align: left; }

        label { display: block; margin-bottom: 0.4rem; font-size: 0.9rem; font-weight: 600; color: #555; }
        select, input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            background-color: #f9f9f9;
            box-sizing: border-box; /* 確保寬度包含 padding */
        }
        select:focus { border-color: #4a90e2; outline: none; }

        /* 身價開關樣式 */
        .vul-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f1f1f1;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .vul-wrapper label { margin: 0; cursor: pointer; }
        input[type="checkbox"] { transform: scale(1.5); cursor: pointer; }

        /* 結果框 */
        .result-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: #f0f9ff;
            border-radius: 12px;
            border: 2px solid #bae6fd;
            transition: all 0.3s ease;
        }
        .result-score {
            font-size: 3rem;
            font-weight: 800;
            color: #0284c7;
            line-height: 1.2;
        }
        .result-desc { font-size: 0.9rem; color: #64748b; margin-top: 0.5rem; }

        /* 負分樣式 */
        .result-box.penalty {
            background-color: #fef2f2;
            border-color: #fecaca;
        }
        .result-box.penalty .result-score { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h2>♠️ 專業橋牌計分</h2>

    <div class="row">
        <div class="col">
            <label>線位 (Level)</label>
            <select id="level">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6 (小滿貫)</option>
                <option value="7">7 (大滿貫)</option>
            </select>
        </div>
        <div class="col">
            <label>花色 (Suit)</label>
            <select id="suit">
                <option value="C">♣️ 梅花</option>
                <option value="D">♦️ 方塊</option>
                <option value="H">♥️ 愛心</option>
                <option value="S">♠️ 黑桃</option>
                <option value="NT">🚫 無王</option>
            </select>
        </div>
    </div>

    <div class="form-group" style="text-align: left; margin-bottom: 1rem;">
        <label>賭倍狀態 (Doubling)</label>
        <select id="doubleState">
            <option value="1">無 (Undoubled)</option>
            <option value="2">❌ 賭倍 (Doubled)</option>
            <option value="4">❌❌ 再賭倍 (Redoubled)</option>
        </select>
    </div>

    <div class="vul-wrapper">
        <label for="isVul">🔴 有身價 (Vulnerable)</label>
        <input type="checkbox" id="isVul">
    </div>

    <div class="form-group" style="text-align: left;">
        <label>吃到墩數 (Tricks Won)</label>
        <select id="tricksWon">
            </select>
    </div>

    <div id="resultBox" class="result-box">
        <div id="scoreOutput" class="result-score">0</div>
        <div id="scoreDesc" class="result-desc">等待輸入...</div>
    </div>
</div>

<script>
    // 初始化墩數選單 (0-13)
    const tricksSelect = document.getElementById('tricksWon');
    for (let i = 0; i <= 13; i++) {
        const option = document.createElement('option');
        option.value = i;
        option.text = i;
        if (i === 7) option.selected = true;
        tricksSelect.appendChild(option);
    }

    // 監聽所有欄位
    const inputs = ['level', 'suit', 'doubleState', 'isVul', 'tricksWon'];
    inputs.forEach(id => {
        document.getElementById(id).addEventListener('change', calculateScore);
    });

    function calculateScore() {
        // 1. 讀取數值
        const level = parseInt(document.getElementById('level').value);
        const suit = document.getElementById('suit').value;
        const doubleFactor = parseInt(document.getElementById('doubleState').value); // 1, 2, or 4
        const isVul = document.getElementById('isVul').checked;
        const tricksWon = parseInt(document.getElementById('tricksWon').value);
        
        const contractTarget = level + 6;
        const diff = tricksWon - contractTarget;
        
        let totalScore = 0;
        let descText = "";
        const resultBox = document.getElementById('resultBox');

        if (diff >= 0) {
            // ================= 成約 (Made) =================
            resultBox.classList.remove('penalty');

            // A. 計算基本墩分 (Trick Score)
            let baseTrickScore = 0;
            if (suit === 'C' || suit === 'D') {
                baseTrickScore = level * 20;
            } else if (suit === 'H' || suit === 'S') {
                baseTrickScore = level * 30;
            } else if (suit === 'NT') {
                baseTrickScore = 40 + (level - 1) * 30;
            }

            // 乘上賭倍係數 (2 或 4)
            let finalTrickScore = baseTrickScore * doubleFactor;

            // B. 獎分計算
            // 判斷是否成局 (Game): 墩分 >= 100
            let gameBonus = 0;
            if (finalTrickScore >= 100) {
                gameBonus = isVul ? 500 : 300;
                descText = "成局 (Game)";
            } else {
                gameBonus = 50; // 部分合約 (Part Score)
                descText = "部分合約 (Part Score)";
            }

            // 滿貫獎分 (Slam) - 與賭倍無關，只看身價
            let slamBonus = 0;
            if (level === 6) {
                slamBonus = isVul ? 750 : 500;
                descText = "小滿貫 (Small Slam)";
            } else if (level === 7) {
                slamBonus = isVul ? 1500 : 1000;
                descText = "大滿貫 (Grand Slam)";
            }

            // 賭倍/再賭倍 額外獎勵 (Insult Bonus)
            let insultBonus = 0;
            if (doubleFactor === 2) insultBonus = 50;
            if (doubleFactor === 4) insultBonus = 100;

            // C. 超墩分數 (Overtricks)
            let overtrickScore = 0;
            if (diff > 0) {
                if (doubleFactor === 1) {
                    // 未賭倍：同基本墩分 (NT/H/S=30, C/D=20)
                    let perTrick = (suit === 'C' || suit === 'D') ? 20 : 30;
                    overtrickScore = diff * perTrick;
                } else if (doubleFactor === 2) {
                    // 賭倍：有身價 200/墩，無身價 100/墩
                    overtrickScore = diff * (isVul ? 200 : 100);
                } else if (doubleFactor === 4) {
                    // 再賭倍：有身價 400/墩，無身價 200/墩
                    overtrickScore = diff * (isVul ? 400 : 200);
                }
            }

            totalScore = finalTrickScore + gameBonus + slamBonus + insultBonus + overtrickScore;
            
            if (diff > 0) descText += ` + 超墩 ${diff}`;

        } else {
            // ================= 倒約 (Down) =================
            resultBox.classList.add('penalty');
            const down = Math.abs(diff); // 倒幾墩
            let penalty = 0;

            if (doubleFactor === 1) {
                // --- 未賭倍 ---
                // 有身價: 100/墩, 無身價: 50/墩
                penalty = down * (isVul ? 100 : 50);
            } else if (doubleFactor === 2) {
                // --- 賭倍 (Doubled) ---
                if (!isVul) {
                    // 無身價賭倍: 第一墩100, 2~3墩各200, 4墩以上各300
                    if (down === 1) penalty = 100;
                    else if (down === 2) penalty = 100 + 200; // 300
                    else if (down === 3) penalty = 100 + 200 + 200; // 500
                    else penalty = 500 + (down - 3) * 300;
                } else {
                    // 有身價賭倍: 第一墩200, 之後每墩300
                    if (down === 1) penalty = 200;
                    else penalty = 200 + (down - 1) * 300;
                }
            } else if (doubleFactor === 4) {
                // --- 再賭倍 (Redoubled) ---
                // 邏輯是賭倍罰分的 2 倍
                let basePenalty = 0;
                if (!isVul) {
                    if (down === 1) basePenalty = 100;
                    else if (down === 2) basePenalty = 300;
                    else if (down === 3) basePenalty = 500;
                    else basePenalty = 500 + (down - 3) * 300;
                } else {
                    if (down === 1) basePenalty = 200;
                    else basePenalty = 200 + (down - 1) * 300;
                }
                penalty = basePenalty * 2;
            }

            totalScore = -penalty;
            descText = `倒約 ${down} 墩`;
        }

        document.getElementById('scoreOutput').innerText = totalScore;
        document.getElementById('scoreDesc').innerText = descText;
    }

    // 初始計算
    calculateScore();
</script>

</body>
</html>
